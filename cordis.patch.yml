# dsh-session-nav bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the dsh.bundle.patch
# manifest field) over dsh-base; activate with
#   dsh plugin --profile web add link:<this-directory>
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (a no-op — the piano bar is fully client-side), and the
# dsh.client declaration in package.json makes the browser half
# (exports "./client") load in the web GUI (shell.overlay slot entry).
- insert:
    - id: dsh-session-nav
      name: '@kiligzzz/dsh-session-nav'
